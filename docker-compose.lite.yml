version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  sidecar:
    build:
      context: ./services/sidecar
      dockerfile: Dockerfile.headless
    ports:
      - "8085:8080"
      - "9229:9229"
    environment:
      - PORT=8080
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - SIDECAR_API_KEY=${SIDECAR_API_KEY:-}
    init: true
    deploy:
      resources:
        limits:
          memory: 768M

  parser:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    environment:
      - CONFIG_PATH=/app/config.yaml
      - GOMEMLIMIT=50MiB
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-10}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-30}
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    ports:
      - "8082:8080" # Web Dashboard
    depends_on:
      - nats
      - redis

  discovery:
    build:
      context: .
      dockerfile: services/discovery/Dockerfile
    environment:
      - CONFIG_PATH=/app/config.yaml
      - SIDECAR_URL=http://sidecar:8080
      - GOMEMLIMIT=50MiB
    volumes:
      - ./config.yaml:/app/config.yaml
    ports:
      - "8081:8081" # Metrics
    depends_on:
      - nats
      - redis
      - sidecar

  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    environment:
      - CONFIG_PATH=/app/config.yaml
      - GOMEMLIMIT=50MiB
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    depends_on:
      - nats
      - redis
      - sidecar

  scraper-reply:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    environment:
      - CONFIG_PATH=/app/config.yaml
      - GOMEMLIMIT=50MiB
      - WORKER_TYPE=reply
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./data:/app/data
    depends_on:
      - nats
      - redis
      - sidecar

  sqlite-web:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-alpine
        RUN pip install sqlite-web
        EXPOSE 8080
        CMD ["sqlite_web", "/data/argus.db", "--host", "0.0.0.0", "--port", "8080", "--no-browser"]
    ports:
      - "8083:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
