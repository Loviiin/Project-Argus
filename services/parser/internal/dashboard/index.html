<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus Lite | OSINT Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-eye"></i> Argus Lite
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('artifacts')">
                <i class="fa-brands fa-discord"></i> Servidores
            </button>
            <button class="tab-btn" onclick="switchTab('comments')">
                <i class="fa-brands fa-tiktok"></i> Comentários
            </button>
            <!-- Link para o SQLite Web que o usuário aprovou -->
            <a href="http://db.seu-dominio.com" target="_blank" class="tab-btn" style="text-decoration: none;">
                <i class="fa-solid fa-database"></i> SQLite Web
            </a>
        </div>
    </header>

    <main>
        <!-- Artifacts Page -->
        <div id="artifacts" class="page active">
            
            <div class="filter-bar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Buscar servidores, links ou texto OCR (FTS5)...">
                </div>
                <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                    <div class="member-filter">
                        <label>Membros:</label>
                        <input type="number" id="min-members" placeholder="Min" min="0">
                        <span>-</span>
                        <input type="number" id="max-members" placeholder="Max" min="0">
                    </div>
                    <div>
                        <label>Status:</label>
                        <select id="status-filter" onchange="loadArtifacts(1)">
                            <option value="ALL">Mostrar Todos</option>
                            <option value="VALID">Apenas Válidos</option>
                            <option value="PENDING">Apenas Pendentes</option>
                            <option value="EXPIRED">Apenas Expirados/Inválidos</option>
                            <option value="RATE_LIMITED">Apenas Bloqueados (Rate Limit)</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="grid" id="artifacts-grid">
                <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando servidores...</div>
            </div>
            <div class="pagination page-selector" id="artifacts-pagination">
            </div>
        </div>

        <!-- Comments Page -->
        <div id="comments" class="page">
            <div class="grid" id="comments-grid">
                <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando comentários...</div>
            </div>
            <div class="pagination page-selector" id="comments-pagination">
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
