<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus Lite | OSINT Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-eye"></i> Argus Lite
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('artifacts')">
                <i class="fa-brands fa-discord"></i> Servidores
            </button>
            <button class="tab-btn" onclick="switchTab('comments')">
                <i class="fa-brands fa-tiktok"></i> Comentários
            </button>
            <button class="tab-btn" onclick="switchTab('stats')">
                <i class="fa-solid fa-chart-line"></i> Status & Métricas
            </button>
        </div>
    </header>

    <main>
        <!-- Artifacts Page -->
        <div id="artifacts" class="page active">
            
            <div class="filter-bar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Buscar servidores, links ou texto OCR (FTS5)...">
                </div>
                <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                    <div class="member-filter">
                        <label>Membros:</label>
                        <input type="number" id="min-members" placeholder="Min" min="0">
                        <span>-</span>
                        <input type="number" id="max-members" placeholder="Max" min="0">
                    </div>
                    <div>
                        <label>Status:</label>
                        <select id="status-filter" onchange="applyFilters()">
                            <option value="ALL">Mostrar Todos</option>
                            <option value="VALID">Apenas Válidos</option>
                            <option value="PENDING">Apenas Pendentes</option>
                            <option value="EXPIRED">Apenas Expirados/Inválidos</option>
                            <option value="RATE_LIMITED">Apenas Bloqueados (Rate Limit)</option>
                        </select>
                    </div>
                    <div>
                        <label>Ordenar Por:</label>
                        <select id="sort-by-filter" onchange="applyFilters()">
                            <option value="date">Data</option>
                            <option value="members">Membros</option>
                            <option value="name">Nome</option>
                            <option value="status">Status</option>
                        </select>
                    </div>
                    <div>
                        <label>Tag:</label>
                        <input type="text" id="tag-filter" placeholder="Ex: gaming" style="width: 100px; padding: 0.5rem; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white;">
                    </div>
                    <div>
                        <label>Ordem:</label>
                        <select id="sort-filter" onchange="applyFilters()">
                            <option value="desc">Descrescente</option>
                            <option value="asc">Ascendente</option>
                        </select>
                    </div>
                    <div>
                        <button onclick="exportData('csv')" class="btn btn-secondary"><i class="fa-solid fa-file-csv"></i> CSV</button>
                        <button onclick="exportData('json')" class="btn btn-secondary"><i class="fa-solid fa-file-code"></i> JSON</button>
                    </div>
                </div>
            </div>

            <div class="grid" id="artifacts-grid">
                <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando servidores...</div>
            </div>
            <div class="pagination page-selector" id="artifacts-pagination">
            </div>
        </div>

        <!-- Comments Page -->
        <div id="comments" class="page">
            <div class="grid" id="comments-grid">
                <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando comentários...</div>
            </div>
            <div class="pagination page-selector" id="comments-pagination">
            </div>
        </div>

        <!-- Stats Page -->
        <div id="stats" class="page">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;" id="stats-summary">
                <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando métricas...</div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div>
                    <h2><i class="fa-solid fa-trophy"></i> Top Contributors</h2>
                    <div class="grid" id="top-contributors-list" style="display: flex; flex-direction: column; gap: 1rem;">
                        <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando...</div>
                    </div>
                </div>
                <div>
                    <h2><i class="fa-solid fa-tags"></i> Top Tags</h2>
                    <div class="grid" id="top-tags-list" style="display: flex; flex-direction: column; gap: 1rem;">
                        <div class="loading"><i class="fa-solid fa-circle-notch fa-spin"></i> Carregando...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
