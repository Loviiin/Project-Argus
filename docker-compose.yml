services:
  nats:
    image: nats:alpine
    container_name: nats-jetstream
    command: -js -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  argus-db:
    image: postgres:18.1-alpine3.23
    container_name: banco-argus-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-argus-post-db}
      TZ: America/Sao_Paulo
    command: postgres -c shared_buffers=128MB -c work_mem=4MB -c maintenance_work_mem=64MB -c effective_cache_size=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus-user -d argus-post-db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  argus-cache:
    image: redis:8.4.0-alpine
    container_name: argus-cache
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  argus-meili:
    image: getmeili/meilisearch:v1.33.1
    container_name: argus-search
    ports: 
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=masterKey123
      - MEILI_ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  tiktok-signer:
    build: ./services/sidecar
    container_name: tiktok-signer
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PORT=8080
      - PROXY_ENABLED=false
    deploy:
      resources:
        limits:
          memory: 1G

  argus-discovery:
    build:
      context: .
      dockerfile: ./services/discovery/Dockerfile
    container_name: argus-discovery
    restart: unless-stopped
    volumes:
      - ./config:/workspaces/Project-Argus/config
    depends_on:
      nats:
        condition: service_healthy
      argus-cache:
        condition: service_healthy
      tiktok-signer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  argus-scraper:
    build:
      context: .
      dockerfile: ./services/scraper/Dockerfile
    container_name: argus-scraper
    restart: unless-stopped
    environment:
      - WORKER_TYPE=top_level
    volumes:
      - ./config:/workspaces/Project-Argus/config
    depends_on:
      nats:
        condition: service_healthy
      argus-db:
        condition: service_healthy
      tiktok-signer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  argus-scraper-reply:
    build:
      context: .
      dockerfile: ./services/scraper/Dockerfile
    container_name: argus-scraper-reply
    restart: unless-stopped
    environment:
      - WORKER_TYPE=reply
    volumes:
      - ./config:/workspaces/Project-Argus/config
    depends_on:
      nats:
        condition: service_healthy
      argus-db:
        condition: service_healthy
      tiktok-signer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  argus-parser:
    build:
      context: .
      dockerfile: ./services/parser/Dockerfile
    container_name: argus-parser
    restart: unless-stopped
    volumes:
      - ./config:/workspaces/Project-Argus/config
    depends_on:
      nats:
        condition: service_healthy
      argus-db:
        condition: service_healthy
      argus-cache:
        condition: service_healthy
      argus-meili:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  nats_data:
  redis_data:
  meili_data: